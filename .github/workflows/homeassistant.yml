name: Build Home Assistant app

on:
  workflow_dispatch:
    inputs:
      clearsignage_ref:
        description: ClearSignage branch to build from
        required: true
        default: prod
        type: choice
        options:
          - prod
          - beta
          - main
      clearsignage_ref_override:
        description: Optional exact tag or commit SHA to build instead of the branch
        required: false
        default: ""
        type: string
      push:
        description: Push the manifest; when disabled, build and discard both architectures
        required: true
        default: true
        type: boolean

# Version selection reads the registry before publishing, so release runs must not overlap.
concurrency:
  group: clearsignage-homeassistant-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # OCI repository names are lowercase, irrespective of the GitHub display name.
  IMAGE: ghcr.io/madebyjansen/clearsignage-ha

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install packaging test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml

      - name: Validate packaging
        run: python -m pytest tests -q

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: clearsignage
          driver: docker-container

      - name: Fetch ClearSignage source
        id: source
        env:
          CLEARSIGNAGE_REF: ${{ inputs.clearsignage_ref_override || inputs.clearsignage_ref }}
          GITHUB_USERNAME: x-access-token
          GITHUB_TOKEN: ${{ secrets.CLEARSIGNAGE_PAT }}
        run: |
          set -euo pipefail

          ASKPASS_SCRIPT="$(mktemp)"
          trap 'rm -f "${ASKPASS_SCRIPT}"' EXIT
          cat > "${ASKPASS_SCRIPT}" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
              *Username*) printf '%s\n' "${GITHUB_USERNAME}" ;;
              *Password*) printf '%s\n' "${GITHUB_TOKEN}" ;;
              *) exit 1 ;;
          esac
          EOF
          chmod 700 "${ASKPASS_SCRIPT}"
          export GIT_ASKPASS="${ASKPASS_SCRIPT}"
          export GIT_TERMINAL_PROMPT=0

          ./scripts/fetch-source.sh
          printf 'revision=%s\n' "$(cat clearsignage/src/CLEARSIGNAGE_REF)" >> "${GITHUB_OUTPUT}"

      - name: Check whether publishing is allowed
        env:
          PUSH: ${{ inputs.push }}
          BRANCH: ${{ inputs.clearsignage_ref }}
          OVERRIDE: ${{ inputs.clearsignage_ref_override }}
          RESOLVED_REF: ${{ steps.source.outputs.revision }}
        run: |
          ./scripts/check-publish-allowed.py \
            --push "${PUSH}" \
            --branch "${BRANCH}" \
            --override "${OVERRIDE}" \
            --built-revision "${RESOLVED_REF}" \
            --release-file clearsignage/release.yaml

      - name: Choose app version
        id: version
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(./scripts/next-image-version.py \
            --owner madeByJansen \
            --package clearsignage-ha \
            --config clearsignage/config.yaml)"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          echo "Building ClearSignage ${{ steps.source.outputs.revision }} as app version ${version}"

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build both architectures
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          RESOLVED_REF: ${{ steps.source.outputs.revision }}
          PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail

          build_from() {
              python - "$1" <<'PY'
          import sys
          import yaml

          with open("clearsignage/build.yaml", encoding="utf-8") as file:
              print(yaml.safe_load(file)["build_from"][sys.argv[1]])
          PY
          }

          if [ "${PUSH}" = "true" ]; then
              output_mode=(--push)
          else
              output_mode=(--output=type=cacheonly)
          fi

          build_one() {
              local platform="$1" build_base="$2" arch_tag="$3"
              docker buildx build \
                --builder clearsignage \
                --platform "${platform}" \
                --build-arg "BUILD_FROM=${build_base}" \
                --build-arg "CLEARSIGNAGE_REF=${RESOLVED_REF}" \
                --label "org.opencontainers.image.revision=${RESOLVED_REF}" \
                --label "org.opencontainers.image.version=${APP_VERSION}" \
                --tag "${IMAGE}:${APP_VERSION}-${arch_tag}" \
                "${output_mode[@]}" \
                clearsignage
          }

          build_one linux/arm64 "$(build_from aarch64)" aarch64
          build_one linux/amd64 "$(build_from amd64)" amd64

      - name: Publish and inspect multi-architecture manifest
        if: inputs.push
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${APP_VERSION}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${APP_VERSION}-aarch64" \
            "${IMAGE}:${APP_VERSION}-amd64"
          docker buildx imagetools inspect "${IMAGE}:${APP_VERSION}"

      - name: Record the published version
        if: inputs.push
        env:
          RECORD_VERSION: ${{ steps.version.outputs.version }}
          GIT_USERNAME: x-access-token
          GIT_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail

          ASKPASS_SCRIPT="$(mktemp)"
          trap 'rm -f "${ASKPASS_SCRIPT}"' EXIT
          cat > "${ASKPASS_SCRIPT}" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
              *Username*) printf '%s\n' "${GIT_USERNAME}" ;;
              *Password*) printf '%s\n' "${GIT_PASSWORD}" ;;
              *) exit 1 ;;
          esac
          EOF
          chmod 700 "${ASKPASS_SCRIPT}"
          export GIT_ASKPASS="${ASKPASS_SCRIPT}"
          export GIT_TERMINAL_PROMPT=0

          ./scripts/record-published-version.sh

      - name: Prune old releases
        if: inputs.push
        env:
          GHCR_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/prune-ghcr-releases.py \
            madeByJansen \
            clearsignage-ha \
            "${APP_VERSION}"

      - name: Remove private source
        if: always()
        run: rm -rf clearsignage/src
